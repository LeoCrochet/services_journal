{% extends "base.html" %}

{% block title %}Удаление клиента{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Удалить клиента?</h1>
<div class="card p-4">
  <p>Вы уверены, что хотите удалить клиента <strong>{{ client.fio }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a href="{% url 'clients:list' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
