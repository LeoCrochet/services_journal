{% extends "base.html" %}

{% block title %}Удаление услуги{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Удалить услугу?</h1>
<div class="card p-4">
  <p>Вы уверены, что хотите удалить услугу <strong>{{ service.name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a href="{% url 'services:list' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
