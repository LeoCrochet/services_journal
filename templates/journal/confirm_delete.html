{% extends "base.html" %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Удалить запись журнала?</h1>
<div class="card p-4">
  <p>Вы уверены, что хотите удалить запись <strong>№{{ order.number|default:order.pk }} от {{ order.document_date }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a href="{% url 'journal:list' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
